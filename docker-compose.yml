services:
  redis:
    image: redis:7-alpine
    container_name: celery-redis
    ports:
      - "127.0.0.1:6379:6379"

  flower:
    image: mher/flower:2.0
    container_name: celery-flower
    command: >
      celery
      --broker=redis://redis:6379/0
      flower
      --port=5555
      --basic-auth=${FLOWER_USER}:${FLOWER_PASSWORD}
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      - redis